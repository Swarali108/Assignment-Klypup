# Scheduled event discovery. Every 3 hours from 08:00 to 20:00 IST (02:30-14:30 UTC),
# plus a manual "Run workflow" button. It reads only the sources config/sources.py
# enables, processes up to 10 new or changed events under a US$1.00 cap, and commits
# events/auto, outputs and cache/llm as github-actions[bot] only when something changed.
# A source that blocks GitHub's IP addresses is recorded in outputs/discovery.json and
# the run still succeeds (discover.py always exits 0).
name: discover

on:
  schedule:
    - cron: "30 2-14/3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      # Downloaded PDFs and parsed pages are not in the repo; keep them between runs.
      - name: Reuse downloaded documents
        uses: actions/cache@v4
        with:
          path: |
            cache/fetch
            cache/pages
          key: documents-${{ github.run_id }}
          restore-keys: documents-

      - name: Discover and process
        id: discover
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_MODEL_STRONG: ${{ secrets.LLM_MODEL_STRONG }}
          MAX_WORKERS: "2"
          # NSE/BSE: off on GitHub runners (cloud IPs get blocked, and the in-API scheduler is the one reader).
          EXCHANGE_SOURCES: "off"
          PYTHONIOENCODING: utf-8
        run: python discover.py --since 7d --process 10 --max-cost 1.00

      - name: Commit results
        if: steps.discover.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events/auto outputs cache/llm cost_log.csv
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "discover: refresh events and call lists"
            git push
          fi
